repos:
  - repo: local
    hooks:
      # - id: task-format
      #   name: Formatear código (Ruff & Black)
      #   # entry: task format
      #   entry: bash -c 'python -m ruff check --fix "$@" && python -m black "$@"' --
      #   language: system
      #   types: [python]
      #   pass_filenames: false
      # --- TAREA 1: Format con Ruff ---
      # Reemplaza: ruff-format (entrada incorrecta) + black-format
      - id: ruff-format
        name: Formatear con Ruff (ruff format)
        entry: python -m ruff format
        language: system
        types: [ python ]
        pass_filenames: true  # Solo actúa sobre archivos modificados/staged
      - id: ruff-check-fix
        name: Fix automático con Ruff (ruff check --fix)
        entry: python -m ruff check --fix
        language: system
        types: [ python ]
        pass_filenames: true  # Solo actúa sobre archivos modificados/staged
      # OBSOLETO - black-format: reemplazado por ruff-format
      # - id: black-format
      #   name: Formatear con Black
      #   entry: python -m black
      #   args: [ src, tests ]
      #   language: system
      #   types: [ python ]
      #   pass_filenames: false

      # --- TAREA 2: Lint con Ruff ---
      # Reemplaza: task-lint (que invocaba pylint, pydocstyle, etc.)
      - id: ruff-lint
        name: Lint con Ruff
        entry: python -m ruff check
        language: system
        types: [ python ]
        pass_filenames: true  # Solo actúa sobre archivos modificados/staged
      # OBSOLETO - task-lint: reemplazado por ruff-lint (mantener para lint completo manual)
