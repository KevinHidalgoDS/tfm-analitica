name: Build and Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 1. Job de pruebas (movido desde tests.yml)
  tests:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools taskipy
          task pip-sync

      - name: Run tests
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=test-results.xml

      - name: Verificar Cobertura
        run: echo "Validaciones completadas y cobertura aprobada."

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            test-results.xml
          retention-days: 1 # Recomendado reducir si solo se usa en el CI

  # 2. Job de SonarQube (actualizado)
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: tests # Obliga a este job a esperar a que termine 'tests'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: . # Descarga los XML en la raíz del proyecto para que Sonar los encuentre

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Descomentado para inyectar los reportes al escáner
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.xunit.reportPath=test-results.xml
