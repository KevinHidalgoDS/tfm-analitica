name: Regenerate Linux requirements

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: Actualizar todas las versiones compatibles
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/regenerate_linux_requirements.yml
  push:
    branches:
      - main
      - develop
    paths:
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/regenerate_linux_requirements.yml

permissions:
  contents: read

concurrency:
  group: linux-requirements-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Generate and validate Linux requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependency tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.1 taskipy==1.14.1

      - name: Regenerate Linux requirements
        env:
          UPGRADE: ${{ inputs.upgrade == true }}
        run: |
          options=()
          if [ "$UPGRADE" = "true" ]; then
            options+=(--upgrade)
          fi
          CUSTOM_COMPILE_COMMAND="task pip-compile-linux" \
            pip-compile pyproject.toml \
              --output-file=requirements-linux.txt "${options[@]}"
          CUSTOM_COMPILE_COMMAND="task pip-compile-dev-linux" \
            pip-compile pyproject.toml --extra=dev \
              --constraint=requirements-linux.txt \
              --output-file=requirements-dev-linux.txt "${options[@]}"

      - name: Validate installation and tests
        run: |
          task pip-sync-linux
          python -m pip check
          python -m pytest --cov=src --cov-report=term

      - name: Upload Linux requirements
        uses: actions/upload-artifact@v4
        with:
          name: linux-requirements-${{ github.run_id }}
          path: |
            requirements-linux.txt
            requirements-dev-linux.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish instructions
        run: |
          {
            echo "## Requisitos Linux generados"
            echo "Commit de origen: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "Descarga el artefacto linux-requirements-${{ github.run_id }} de esta ejecucion."
            echo "Extrae ambos archivos en la raiz del repositorio y versionalos en la misma rama."
            echo "Este workflow no modifica el repositorio ni reemplaza los archivos de Windows."
          } >> "$GITHUB_STEP_SUMMARY"
