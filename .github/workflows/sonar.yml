name: SonarQube

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt
          # pip install pytest pytest-cov
          pip install pip-tools taskipy
          task pip-sync

      - name: Run tests
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=test-results.xml

      # - name: Ejecutar Suite Completa (Format, Lint, Tests)
      #   # Esto ejecuta task format, task lint y task tests-cov bloqueando el CI si falla alguno
      #   run: task all

      - name: Verificar Cobertura
        # Pytest fallará automáticamente si la cobertura baja de 80% gracias a fail_under=80 en
        # pyproject.toml
        run: echo "Validaciones completadas y cobertura aprobada."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true